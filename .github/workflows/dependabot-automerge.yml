name: Dependabot automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI, then merge non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Wait on every check except this job's own, which would deadlock.
          for _ in $(seq 1 40); do
            failed=$(gh pr checks "$PR_URL" --json name,bucket \
              -q '[.[] | select(.name != "automerge") | select(.bucket == "fail" or .bucket == "cancel")] | length')
            if [ "$failed" != "0" ]; then
              echo "CI failed; leaving the pull request open."
              exit 1
            fi
            pending=$(gh pr checks "$PR_URL" --json name,bucket \
              -q '[.[] | select(.name != "automerge") | select(.bucket == "pending")] | length')
            if [ "$pending" = "0" ]; then
              gh pr merge "$PR_URL" --squash --delete-branch
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for CI; leaving the pull request open."
          exit 1
