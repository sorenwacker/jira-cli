default_language_version:
  python: python3.12

repos:
  # --- Commit message linting ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, docs, test, ci, chore, perf, build, style, revert]

  # --- Standard checks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Spell check ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  # --- uv lockfile sync ---
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.4
    hooks:
      - id: uv-lock

  # --- Ruff: lint + format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Vulture: dead code detection ---
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.13
    hooks:
      - id: vulture
        args: [src, tests, --min-confidence, "80"]

  # --- Mypy: type checking ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src/, tests/]

  # --- Pylint: supplementary linting ---
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        pass_filenames: false
        args: [src/, tests/]

  # --- Function length check (max 32 lines) ---
  - repo: local
    hooks:
      - id: flake8-function-length
        name: flake8-function-length
        entry: uv run flake8
        language: system
        types: [python]
        pass_filenames: true
